server:
  address: ${FARM_BIND:127.0.0.1}
  port: ${FARM_PORT:9175}
  shutdown: graceful
  error:
    include-message: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${FARM_DATABASE_URL:jdbc:h2:file:./data/zhinong;DB_CLOSE_ON_EXIT=FALSE}
    username: ${FARM_DATABASE_USER:sa}
    password: ${FARM_DATABASE_PASSWORD:}
    hikari:
      connection-timeout: ${FARM_DATABASE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 1000
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      base-path: /api/ops
      exposure:
        include: health,metrics
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
farm:
  demo: ${FARM_DEMO:false}
  demo-rich: ${FARM_DEMO_RICH:true}
  demo-portfolio: ${FARM_DEMO_PORTFOLIO:false}
  demo-live: ${FARM_DEMO_LIVE:${FARM_DEMO_STREAM_ENABLED:false}}
  research-history: ${FARM_RESEARCH_HISTORY:false}
  demo-stream:
    enabled: ${FARM_DEMO_STREAM_ENABLED:false}
    days: ${FARM_DEMO_STREAM_DAYS:30}
  bootstrap-password: ${FARM_BOOTSTRAP_PASSWORD:}
  llm:
    url: ${FARM_LLM_URL:}
    api-key: ${FARM_LLM_API_KEY:}
    model: ${FARM_LLM_MODEL:}
    fallback-url: ${FARM_LLM_FALLBACK_URL:}
    fallback-model: ${FARM_LLM_FALLBACK_MODEL:}
    timeout-seconds: ${FARM_LLM_TIMEOUT:20}
