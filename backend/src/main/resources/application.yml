server:
  address: ${FARM_BIND:127.0.0.1}
  port: ${FARM_PORT:9175}
  shutdown: graceful
  error:
    include-message: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${FARM_DATABASE_URL:jdbc:h2:file:./data/zhinong;DB_CLOSE_ON_EXIT=FALSE}
    username: ${FARM_DATABASE_USER:sa}
    password: ${FARM_DATABASE_PASSWORD:}
    hikari:
      connection-timeout: ${FARM_DATABASE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 1000
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      # Jackson 3 rejects omitted primitive fields; request records rely on Jackson 2's 0/false defaults.
      fail-on-null-for-primitives: false
management:
  endpoints:
    web:
      base-path: /api/ops
      exposure:
        include: health,metrics
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
farm:
  weather:
    enabled: ${FARM_WEATHER_ENABLED:true}
  # Business calendar for "today", overdue tasks, daily limits and AI prompts; independent of the server zone.
  zone: ${FARM_ZONE:Asia/Shanghai}
  demo: ${FARM_DEMO:false}
  demo-rich: ${FARM_DEMO_RICH:true}
  demo-portfolio: ${FARM_DEMO_PORTFOLIO:false}
  demo-live: ${FARM_DEMO_LIVE:${FARM_DEMO_STREAM_ENABLED:false}}
  research-history: ${FARM_RESEARCH_HISTORY:false}
  demo-stream:
    enabled: ${FARM_DEMO_STREAM_ENABLED:false}
    # Resume only current fictional readings, independently of all historical/business seeders.
    live-only: ${FARM_DEMO_STREAM_LIVE_ONLY:false}
    days: ${FARM_DEMO_STREAM_DAYS:30}
  # Ages out SIMULATED demo telemetry on demo farms (only when farm.demo=true); see docs/服务稳定性与性能指南.md.
  demo-retention:
    enabled: ${FARM_DEMO_RETENTION_ENABLED:true}
    full-days: ${FARM_DEMO_RETENTION_FULL_DAYS:2}
    dense-days: ${FARM_DEMO_RETENTION_DENSE_DAYS:30}
    daily-days: ${FARM_DEMO_RETENTION_DAILY_DAYS:731}
    batch-size: ${FARM_DEMO_RETENTION_BATCH_SIZE:500}
    delay-ms: ${FARM_DEMO_RETENTION_DELAY_MS:3600000}
  bootstrap-password: ${FARM_BOOTSTRAP_PASSWORD:}
  llm:
    url: ${FARM_LLM_URL:}
    api-key: ${FARM_LLM_API_KEY:}
    model: ${FARM_LLM_MODEL:}
    fallback-url: ${FARM_LLM_FALLBACK_URL:}
    fallback-model: ${FARM_LLM_FALLBACK_MODEL:}
    timeout-seconds: ${FARM_LLM_TIMEOUT:20}
